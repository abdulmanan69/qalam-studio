name: Feature request
description: Suggest an idea or improvement.
labels: ['enhancement', 'triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the calligraphy task you are trying to do and what gets in the way.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? Mockups and references to other tools (e.g. Kelk) are welcome.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Text shaping / fonts
        - Letter parts (dots, marks, kashida)
        - Canvas and tools
        - Layers and properties
        - Templates and ornaments
        - Import / export
        - Interface, languages, accessibility
        - Other
    validations:
      required: true

  - type: dropdown
    id: script
    attributes:
      label: Script style (if relevant)
      multiple: true
      options:
        - Nastaliq
        - Naskh
        - Thuluth
        - Ruqaa
        - Kufi
        - Diwani
        - Not script-specific

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
