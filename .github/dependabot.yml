version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom', 'react-router']
      radix:
        patterns: ['@radix-ui/*']
      lint:
        patterns:
          ['eslint', 'eslint-*', '@eslint/*', 'typescript-eslint', 'prettier', 'prettier-*', 'globals']
      test:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', 'jsdom', 'fake-indexeddb', '@playwright/test']
      build:
        patterns: ['vite', '@vitejs/*', 'tailwindcss', '@tailwindcss/*', 'typescript']
    ignore:
      # Major versions (React 19, TypeScript 7, ESLint 10, React Router 8, …) change APIs and
      # peer-dependency ranges; they are upgraded deliberately in a dedicated PR, not by bot.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
