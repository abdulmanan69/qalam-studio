version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom', 'react-router']
      radix:
        patterns: ['@radix-ui/*']
      lint:
        patterns:
          ['eslint', 'eslint-*', '@eslint/*', 'typescript-eslint', 'prettier', 'prettier-*', 'globals']
      test:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', 'jsdom', 'fake-indexeddb', '@playwright/test']
      build:
        patterns: ['vite', '@vitejs/*', 'tailwindcss', '@tailwindcss/*', 'typescript']
    ignore:
      # Stay on React 18 until the editor stack is validated on 19.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      # eslint-plugin-jsx-a11y does not support ESLint 10 yet.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
